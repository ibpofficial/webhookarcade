<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <linearGradient id="chaos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121024"/>
      <stop offset="100%" stop-color="#180e29"/>
    </linearGradient>

    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <style>
      @keyframes pulse-flow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-flow {
        stroke-dasharray: 6 6;
        animation: pulse-flow 1.5s linear infinite;
      }
      .lbl {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <rect width="960" height="300" rx="14" fill="url(#chaos-bg)" stroke="#271c3d" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" class="lbl" font-size="10.5" font-weight="800" fill="#ec4899" letter-spacing="1.2">REPRODUCIBLE CHAOS SIMULATION</text>
    <text x="0" y="24" class="lbl" font-size="18" font-weight="800" fill="#ffffff">Deterministic Fault Injection &amp; Automated Verification Cycle</text>
  </g>

  <!-- Flow Arrows (Background) -->
  <g fill="none" stroke="url(#flow-grad)" stroke-width="2.5" class="anim-flow">
    <path d="M 220 170 L 270 170"/>
    <path d="M 470 170 L 520 170"/>
    <path d="M 720 170 L 770 170"/>
  </g>

  <!-- STEP 1: Seeded RNG -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="#151226" stroke="#4c1d95" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#2e1065"/>
    <rect x="0" y="16" width="180" height="10" fill="#2e1065"/>
    <text x="90" y="18" class="lbl" font-size="10.5" font-weight="800" fill="#e9d5ff" text-anchor="middle">1. DETERMINISTIC SEED</text>

    <text x="14" y="52" class="lbl" font-size="12" font-weight="700" fill="#ffffff">Mulberry32 PRNG</text>
    <text x="14" y="70" class="lbl" font-size="10" fill="#c4b5fd">Seed: #842910</text>
    <text x="14" y="92" class="lbl" font-size="10.5" fill="#94a3b8">Every delay, duplicate order, and drop is 100% reproducible across CI runs.</text>
  </g>

  <!-- STEP 2: Fault Injection -->
  <g transform="translate(270, 100)">
    <rect x="0" y="0" width="200" height="140" rx="10" fill="#1f1127" stroke="#be185d" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="26" rx="10" fill="#831843"/>
    <rect x="0" y="16" width="200" height="10" fill="#831843"/>
    <text x="100" y="18" class="lbl" font-size="10.5" font-weight="800" fill="#fce7f3" text-anchor="middle">2. CHAOS FAULT ENGINE</text>

    <text x="14" y="48" class="lbl" font-size="10.5" font-weight="600" fill="#ffffff">🌪️ Duplicate Bursts (x2..x50)</text>
    <text x="14" y="68" class="lbl" font-size="10.5" font-weight="600" fill="#ffffff">⏱️ Artificial Delay Jitter</text>
    <text x="14" y="88" class="lbl" font-size="10.5" font-weight="600" fill="#ffffff">🔀 Out-of-Order Shuffling</text>
    <text x="14" y="108" class="lbl" font-size="10.5" font-weight="600" fill="#ffffff">💥 Random 5xx Failures</text>
    <text x="14" y="128" class="lbl" font-size="10.5" font-weight="600" fill="#ffffff">🔑 Tampered HMAC Keys</text>
  </g>

  <!-- STEP 3: Outbound Dispatch -->
  <g transform="translate(520, 100)">
    <rect x="0" y="0" width="200" height="140" rx="10" fill="#0d1b2a" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="26" rx="10" fill="#0369a1"/>
    <rect x="0" y="16" width="200" height="10" fill="#0369a1"/>
    <text x="100" y="18" class="lbl" font-size="10.5" font-weight="800" fill="#e0f2fe" text-anchor="middle">3. TARGET DISPATCH</text>

    <text x="14" y="52" class="lbl" font-size="12" font-weight="700" fill="#ffffff">Outbound Execution</text>
    <text x="14" y="72" class="lbl" font-size="10.5" fill="#7dd3fc">• DNS IP-Pinned Socket</text>
    <text x="14" y="90" class="lbl" font-size="10.5" fill="#7dd3fc">• Microsecond Latency Clock</text>
    <text x="14" y="108" class="lbl" font-size="10.5" fill="#7dd3fc">• Delivery Recording (DB)</text>
  </g>

  <!-- STEP 4: Assertions & Grading -->
  <g transform="translate(770, 100)">
    <rect x="0" y="0" width="150" height="140" rx="10" fill="#062d22" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="26" rx="10" fill="#047857"/>
    <rect x="0" y="16" width="150" height="10" fill="#047857"/>
    <text x="75" y="18" class="lbl" font-size="10.5" font-weight="800" fill="#d1fae5" text-anchor="middle">4. ASSERTIONS</text>

    <text x="12" y="50" class="lbl" font-size="11" font-weight="700" fill="#34d399">✔ Status Check</text>
    <text x="12" y="66" class="lbl" font-size="9.5" fill="#a7f3d0">status_equals == 200</text>
    <text x="12" y="88" class="lbl" font-size="11" font-weight="700" fill="#34d399">✔ Latency Budget</text>
    <text x="12" y="104" class="lbl" font-size="9.5" fill="#a7f3d0">latency_below_ms &lt; 200</text>
    <text x="12" y="126" class="lbl" font-size="11" font-weight="700" fill="#34d399">✔ Idempotency</text>
  </g>
</svg>
