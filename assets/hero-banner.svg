<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="violet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2234" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f1624" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filter for neon glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <style>
      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 0.3; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }
      @keyframes float-dot {
        0% { transform: translateY(0px); opacity: 0.4; }
        50% { transform: translateY(-8px); opacity: 0.9; }
        100% { transform: translateY(0px); opacity: 0.4; }
      }
      @keyframes stream-beam {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .ring-animated {
        transform-origin: 120px 105px;
        animation: pulse-ring 4s ease-in-out infinite;
      }
      .beam-animated {
        stroke-dasharray: 20, 10;
        animation: stream-beam 15s linear infinite;
      }
      .cursor-blink {
        animation: cursor-blink 1s infinite;
      }
      .dot-1 { animation: float-dot 3s ease-in-out infinite; }
      .dot-2 { animation: float-dot 4s ease-in-out infinite 1s; }
      .dot-3 { animation: float-dot 3.5s ease-in-out infinite 0.5s; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid-pattern)"/>

  <!-- Top Ambient Glow -->
  <circle cx="200" cy="80" r="180" fill="#8b5cf6" opacity="0.12" filter="blur(60px)"/>
  <circle cx="950" cy="220" r="220" fill="#06b6d4" opacity="0.10" filter="blur(70px)"/>

  <!-- Decorative Signal Waves -->
  <path d="M -50 340 Q 250 280, 550 330 T 1250 290" fill="none" stroke="url(#glow-grad)" stroke-width="1.5" opacity="0.3" class="beam-animated"/>
  <path d="M -50 360 Q 280 320, 600 370 T 1250 330" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.2" class="beam-animated"/>

  <!-- Brand Mark / Icon (Left) -->
  <g transform="translate(60, 45)">
    <!-- Animated Outer Concentric Radar Rings -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" class="ring-animated"/>
    <circle cx="60" cy="60" r="44" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="20" y="20" width="80" height="80" rx="20" fill="url(#violet-cyan)" filter="url(#neon-glow)"/>
    <rect x="22" y="22" width="76" height="76" rx="18" fill="#0a0e17"/>

    <!-- Radio / Antenna Glyph -->
    <path d="M 60 42 A 18 18 0 0 1 78 60 M 60 36 A 24 24 0 0 1 84 60 M 60 48 A 12 12 0 0 1 72 60" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 42 A 18 18 0 0 0 42 60 M 60 36 A 24 24 0 0 0 36 60 M 60 48 A 12 12 0 0 0 48 60" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="5" fill="#ffffff"/>
    <line x1="60" y1="65" x2="60" y2="84" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Title & Core Messaging -->
  <g transform="translate(195, 75)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981" class="dot-1"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.8">100% OPEN-SOURCE (MIT)</text>

    <!-- Main Title -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1.2">
      Webhook Arcade
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      Every webhook. Every event. Every possibility. One playground.
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 125)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#151d2f" stroke="#25334d" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#a78bfa">⚡ Raw Byte Buffer</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="156" height="28" rx="6" fill="#151d2f" stroke="#25334d" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🛡️ DNS IP-Pinned SSRF</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(314, 0)">
        <rect x="0" y="0" width="128" height="28" rx="6" fill="#151d2f" stroke="#25334d" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#34d399">🧪 Chaos Injection</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(452, 0)">
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#151d2f" stroke="#25334d" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f472b6">🔁 Replay Diffing</text>
      </g>
    </g>
  </g>

  <!-- Live Terminal / Interactive Card (Right) -->
  <g transform="translate(680, 50)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="460" height="310" rx="12" fill="url(#card-grad)" stroke="#222f46" stroke-width="1.5" filter="url(#neon-glow)"/>
    <rect x="0" y="0" width="460" height="310" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

    <!-- Window Topbar -->
    <rect x="0" y="0" width="460" height="36" rx="12" fill="#111827"/>
    <rect x="0" y="24" width="460" height="12" fill="#111827"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="230" y="22" font-family="monospace" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">arcade-terminal ~ live-forwarder</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 56)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
      <!-- Command 1 -->
      <text x="0" y="16" fill="#94a3b8">
        <tspan fill="#38bdf8">$</tspan> arcade listen --to http://localhost:3000/webhook
      </text>

      <!-- Status line -->
      <text x="0" y="42" fill="#10b981" font-weight="700">
        ✔ [CONNECTED] Socket.IO authorized to workspace_0f9a2
      </text>
      <text x="0" y="62" fill="#64748b">
        Forwarding live inbound events directly to localhost...
      </text>

      <!-- Divider -->
      <line x1="0" y1="76" x2="420" y2="76" stroke="#1e293b" stroke-width="1"/>

      <!-- Event 1 Log -->
      <text x="0" y="98" fill="#a78bfa" font-weight="600">
        [13:30:02] POST /ingest/wha_live_99f2e
      </text>
      <text x="0" y="118" fill="#e2e8f0">
        Event: <tspan fill="#38bdf8">invoice.paid</tspan> • Size: <tspan fill="#facc15">1.4 kB</tspan> • Sig: <tspan fill="#34d399">HMAC-SHA256 (Valid)</tspan>
      </text>
      <text x="0" y="138" fill="#10b981">
        ↳ 200 OK forwarded to :3000 in 14ms (Body: Matched)
      </text>

      <!-- Event 2 Log (Chaos Injected) -->
      <text x="0" y="168" fill="#f43f5e" font-weight="600">
        [13:30:05] [CHAOS LAB] Duplicate Storm Burst x3
      </text>
      <text x="0" y="188" fill="#e2e8f0">
        Event: <tspan fill="#fb923c">payment.dispute.created</tspan> • Seed: <tspan fill="#64748b">#842910</tspan>
      </text>
      <text x="0" y="208" fill="#38bdf8">
        ↳ Assertions: <tspan fill="#10b981">idempotent_processed_once (PASSED)</tspan>
      </text>

      <!-- Active Cursor -->
      <g transform="translate(0, 230)">
        <text x="0" y="0" fill="#38bdf8" font-weight="700">$</text>
        <rect x="14" y="-10" width="8" height="14" fill="#38bdf8" class="cursor-blink"/>
      </g>
    </g>
  </g>

  <!-- Bottom Interactive Status Bar -->
  <g transform="translate(60, 355)">
    <rect x="0" y="0" width="1080" height="38" rx="8" fill="#0c121e" stroke="#1e293b" stroke-width="1"/>

    <!-- Left Stats -->
    <circle cx="24" cy="19" r="4.5" fill="#10b981" class="dot-2"/>
    <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
      STATUS: ALL CORE RELIABILITY ENGINES OPERATIONAL
    </text>

    <!-- Center Badges -->
    <text x="540" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">
      Dual Database Engine: <tspan fill="#38bdf8">SQLite (Local Zero-Config)</tspan> / <tspan fill="#38bdf8">PostgreSQL (Pooled Production)</tspan>
    </text>

    <!-- Right Stats -->
    <text x="1055" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="end">
      TEST COVERAGE: 19/19 VERIFIED
    </text>
  </g>
</svg>
