services:
  postgres:
    image: postgres:16-alpine
    container_name: arcade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arcade
      POSTGRES_PASSWORD: arcade_secret
      POSTGRES_DB: webhook_arcade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcade -d webhook_arcade"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arcade_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: arcade_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://arcade:arcade_secret@postgres:5432/webhook_arcade?schema=public
      REDIS_URL: redis://redis:6379
      PUBLIC_INGEST_URL: http://localhost:4000/ingest
      PUBLIC_WEB_URL: http://localhost:5173
      JWT_SECRET: dev_jwt_signing_secret_for_webhook_arcade_min_32_chars
      ALLOW_LOCALHOST_TARGETS: "false"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: arcade_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:

